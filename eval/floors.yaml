# eval/floors.yaml — the CI gate's floors (design §4.10 / docs/plans/
# 2026-09-27-v0-plan.md's S4 row: "make gate ... fails below eval/
# floors.yaml").
#
# `make gate` runs `abusekit eval --dataset eval/fixtures/synthetic/
# events.jsonl --labels eval/fixtures/synthetic/labels.jsonl --rule
# new_account_velocity --scorer local --slice full --floors eval/
# floors.yaml` and fails (exit 1) if any entry below is violated.
#
# Values were set from the FIRST real run against the committed synthetic
# corpus (2026-09-28, local weights as of config/local_weights.yaml at
# that commit): precision 0.8276 (Wilson 95% low 0.7109), recall 0.8889
# (Wilson 95% low 0.7781), ECE 0.1733. Each floor below is that run's own
# number minus a small margin (design: "floor = lower interval bound of
# the reference run") — precision/recall floors sit at or just below the
# Wilson lower bound; the ECE ceiling sits a little above the observed
# value, since ECE has no analogous one-sided interval computed here.
#
# To raise a floor after a genuine improvement (a real weight retune, a
# new calibration, a better scorer): re-run the command above, confirm
# the new numbers, and move each floor up to (new Wilson low - a small
# margin) / (new ECE + a small margin) — never past what was actually
# observed, and never as a way to silence a regression rather than fix
# one. Lowering a floor requires the same PR-review bar as any other
# config change; it should never happen in the same PR that also
# regresses the metric it's lowering.
floors:
  - rule: new_account_velocity
    scorer: local
    slice: full
    min_precision: 0.68
    min_recall: 0.75
    max_ece: 0.22
