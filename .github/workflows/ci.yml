# abusekit CI: build, vet, and the fast (DB-independent) unit tests on
# every push/PR, plus a second job that runs the full suite — including
# internal/store's and cmd/abusekit's DB-backed tests — against a real
# Postgres service container. Locally, those tests self-migrate
# (store.ApplyMigrations) and skip cleanly when no database is reachable;
# this job sets ABUSEKIT_REQUIRE_DB=1 (S11) so the same tests FAIL instead
# if the service container above isn't reachable, since a silently-skipped
# DB suite reporting green here would be worse than a red build.
#
# S4 adds the `gate` job: `make gate` runs `abusekit eval` against the
# committed synthetic corpus (eval/fixtures/synthetic/) with the local
# scorer and fails the build if a floor in eval/floors.yaml is violated
# (design §4.10 / plan S4's CI gate). It needs no Postgres and no
# network — the local scorer needs no cassette.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOAMD64: v1

jobs:
  build-and-unit-test:
    name: build, vet, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: build
        run: make build
      - name: lint (gofmt + go vet)
        run: make lint
      - name: unit tests (no DB)
        env:
          ABUSEKIT_GOLDEN_EXPECT_PROFILE: amd64-fma
        run: make test
      - name: exact golden replay without optional FMA
        env:
          GOAMD64: v1
          GODEBUG: cpu.fma=off
          ABUSEKIT_GOLDEN_EXPECT_PROFILE: amd64-no-fma
        run: go test ./eval ./cmd/abusekit -run TestGolden -count=1

  gate:
    name: eval harness gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: eval harness gate (synthetic corpus, local scorer)
        run: make gate

  db-test:
    name: DB-backed tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: e2a
          POSTGRES_PASSWORD: e2a
          POSTGRES_DB: abusekit_test
        # Mapped to 5433 to match this repo's default
        # ABUSEKIT_TEST_DATABASE_URL, the same port convention e2a and
        # e2a-ops's own test suites use for their local Postgres.
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U e2a -d abusekit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: full test suite (with DB)
        env:
          ABUSEKIT_TEST_DATABASE_URL: postgres://e2a:e2a@localhost:5433/abusekit_test?sslmode=disable
          # S11: fail (not skip) a DB-backed test if the service container
          # above isn't reachable — a quietly-skipped DB suite in CI would
          # report green while testing nothing.
          ABUSEKIT_REQUIRE_DB: "1"
        run: make test-db

  golden-arm64:
    name: exact golden replay (ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: ARM64 baseline and mutation tests
        env:
          ABUSEKIT_GOLDEN_EXPECT_PROFILE: arm64
        run: go test ./eval ./cmd/abusekit -run TestGolden -count=1
