# config/rules.yaml — the rule set (design §4.5). Loaded by
# internal/config.Load against a model.Registry, a FeatureSet, and
# config/vendors.yaml.
#
# S1 ships exactly one rule: new_account_velocity, scored by the always-
# available `local` adapter (internal/model/local). It is the "advise
# rule of last resort" design §4.6 describes — the only rule that can run
# with nothing but the local scorer registered, which is all S1 wires up.
# The jev/laya shadow rules from the design §4.5 example arrive with
# their adapters in S5; adding them here before S5 would fail Load with
# "unknown scorer" against this slice's registry.
#
# S2b adds seven inputs (send volume, webmail, recipient hashing, subject
# brand match) to this SAME rule, addressing common bulk-phishing shapes —
# see docs/design's [S2b] amendment to §4.5 and config/local_weights.yaml
# for each new weight's fixture-verified sensitivity window.
tiers:
  medium: 0.4
  high: 0.8
min_scored_advise: 1
text_rules_need_feature_support: true
rules:
  - name: new_account_velocity
    mode: advise
    scorer: local
    inputs:
      - core.subject_age_h
      - core.resource_velocity_1h
      - core.resource_total
      - core.credential_velocity_1h
      - core.credential_total
      - core.upgrade_delay_min
      - core.upgraded
      - core.declines_before_first_success
      - core.first_funding_prepaid
      - brand.name_match
      - brand.name_has_at
      - email.first_day_distinct_domains
      - email.self_send_before_external
      - core.linked_deleted_n
      - core.linked_labelled_abusive_n
      - core.fingerprint_seen_on_other_subjects
      - core.neighbors_truncated
      - core.burst_ratio_24h_vs_lifetime
      - email.sends_10m_max
      - email.sends_1h
      - email.sends_first_day
      - email.webmail_recipient_share
      - email.webmail_sends_1h
      - email.distinct_recipients_1h
      - email.subject_brand_match
    labels: [benign, suspicious, abusive]
    benign_label: benign
    threshold: 0.6
