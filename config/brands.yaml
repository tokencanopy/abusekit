# config/brands.yaml — the curated brand-impersonation name list
# (internal/feature.LoadBrandsFile, design §1, S3 fix round).
#
# Data, not logic: reviewed and extended like any other config, matched via
# internal/feature.BrandSet's word/token-boundary-aware matcher — never a
# bare substring check — after Skeleton-folding both the candidate text and
# every name/alias below.
#
# R6 round 2 (option (a)): apple, stripe, google, amazon, dhl and
# microsoft are RE-INCLUDED below, no longer excluded outright. S3
# originally left them out because they're generic enough to appear
# constantly in legitimate agent/integration names ("Stripe Webhook
# Relay", "Google Calendar Sync", "Microsoft Teams Relay") and
# word-boundary matching alone can't tell "impersonating Stripe" from "a
# real Stripe integration named after Stripe". The fix isn't exclusion
# any more: internal/feature.BrandSet.Matches now suppresses a match
# outright when the candidate text ALSO contains an integration-adjacent
# word (integration, webhook, sync, relay, notifier, tracking, bot,
# connector, api, import, export) anywhere in it — applied uniformly to
# every brand here, not just these six (an already-shipped, unambiguous
# brand like PayPal needs the identical protection: "PayPal integration"
# is a reviewed false-positive case on its own). See BrandSet's own doc
# comment for the exact rule and why it's text-wide rather than
# positional.
#
# S2b's N2 fix round adds a second, independent suppression: a brand
# mentioned as part of describing an ordinary community gathering
# ("<brand> group meetup", "<brand> fan club") does not match either —
# common, unremarkable text for a social-media brand in particular, not a
# lure.
#
# Still excluded: chase, irs. These are short, ordinary English words/
# abbreviations ("chase" the verb, "irs" as a generic acronym) whose
# false-positive surface neither the integration-token rule nor the
# case-sensitive-token option below bounds well — proper context-aware
# matching for these remains future work (see docs/design's open
# questions).
#
# S2b's N1 fix round adds `case_sensitive` for a brand whose Name is a
# short, single word that also doubles as an ordinary English word or
# abbreviation: `ups` below (moved out of the excluded set) only matches
# the identical-case standalone token "UPS", never the everyday word
# "ups" (as in "its ups and downs").
#
# S2b's round 2 (H1): a category comment below names the CATEGORY only
# (marketplace, social, shipping, ...) — it never pairs a category with a
# specific quoted lure theme observed for that category's brands. See
# internal/feature's TestBrandsYAML_CategoryCommentsStayGeneric.
#
# Categories below are alphabetized within each one.
brands:
  # Financial / payments
  - name: Bank of America
  - name: Binance
  - name: Coinbase
  - name: PayPal
    aliases: ["Pay Pal"]
  - name: Wells Fargo

  # Retail / e-commerce
  - name: Amazon
  - name: Walmart

  # Shipping / postal (already-shipped carriers)
  - name: DHL
  - name: FedEx
  - name: USPS

  # Subscription / streaming
  - name: Netflix

  # Tech / platform (generic single-word names, integration-token gated)
  - name: Apple
  - name: Google
  - name: Microsoft
  - name: Stripe

  # Marketplace / classifieds
  - name: Depop
  - name: eBay
  - name: Etsy
  - name: Mercari
  - name: Poshmark
  - name: Shopify
  - name: Vinted

  # Social / community. N2's community-context gate (a brand mentioned as
  # part of an ordinary group/meetup/fan-club description) applies to
  # every entry here, not only these four.
  - name: Facebook
  - name: Instagram
  - name: TikTok
    aliases: ["Tik Tok"]
  - name: WhatsApp
    aliases: ["What's App"]

  # Travel / booking
  - name: Airbnb
  - name: Booking.com

  # Shipping / postal (additional carriers)
  - name: Australia Post
  - name: Canada Post
  - name: DPD
  - name: Evri
  - name: PostNL
    aliases: ["Post NL"]
  - name: Royal Mail
  - name: UPS
    case_sensitive: true
