# config/local_weights.yaml — the `local` scorer's logistic model
# (internal/model/local, design §4.6).
#
# PLACEHOLDER WEIGHTS. Every sign and magnitude below is hand-set to a
# plausible direction from the synthetic replay fixtures (design §1,
# eval/fixtures/), not fit against labelled data. They are reviewed like
# code and are expected to be replaced by the first `abusekit calibrate`/
# gate run (design §4.6, open question 5; plan.md S9).
#
# linear = bias + sum(weight[feature] * features[feature])
# p(non-benign) = sigmoid(linear); p(benign) = 1 - p(non-benign)
#
# Feature set is exactly design §4.5's `new_account_velocity` inputs list.
# A feature named here with no corresponding rule input is harmless (dead
# weight); a rule input with no weight here contributes 0 — see
# internal/model/local.Scorer.Score's doc comment.
#
# S2 fix round (B1): retuned from S1's placeholders against eval/fixtures'
# full set (reference_operator, burst, churn, benign_transactional,
# benign_fast_onboarding, benign_integration_heavy, dormant_then_blast) —
# see internal/worker/replay_test.go's TestReplay_* for the score-band
# assertions these weights satisfy, and the PR body's "which fixture
# bounded which weight" table for how each one below was chosen. The
# short version: `upgraded` and a much smaller `upgrade_delay_min`
# together replace S1's single `upgrade_delay_min`-only signal (a small
# delay used to be read as "just upgraded" whether or not an upgrade
# actually happened); `resource_velocity_1h`/`key_velocity_1h` came down
# sharply (S1's magnitude alone made an ordinary few-agents-in-an-hour
# onboarding score `high`); `name_brand_match` went up to let
# `dormant_then_blast` (no payment signals at all) still cross the `high`
# threshold on resource burst + brand name alone; `linked_deleted_n` went
# up substantially so design's "high from the third churned subject
# onward" (§1.2(c)) is met now that the count also saturates at 3.
#
# Round 2 (R1): NO weight below changed value. The round-2 re-review found
# self_send_before_external and first_day_distinct_domains — both counts,
# unlike every other feature here, with no natural ceiling of their own —
# could swamp the model on a perfectly benign account once the raw count
# ran high (8 self-test emails, 30 real customer domains, or both at once
# for an agent literally named "PayPal integration" that only ever
# self-sends). Both are now capped at the FEATURE level
# (internal/feature.selfSendBeforeExternalCap = 2,
# firstDayDistinctDomainsCap = 10) rather than by lowering these weights —
# lowering the weight would have also weakened the feature for every
# fixture where it fires within a reasonable range, where it's a
# perfectly good signal. Verified (see eval/fixtures/README.md and
# internal/worker/replay_test.go's four new benign_* fixtures) that
# capping alone, with every weight below UNCHANGED, resolves every
# reported false positive while every fixture that must reach `high`
# still does so with margin (risk >= ~0.87, a logit margin of >= 0.5 above
# the `high` cut point) — see mutation_test.go's
# TestLocalWeights_GoldenSignsAndNonZero and isolatedWeightScenarios for
# how every one of these 18 weights (not just the ones a wide realistic
# fixture happens to be sensitive to) is now provably load-bearing.
version: v1
benign_label: benign
bias: -4.5
weights:
  # Negative: an older account is less likely to be a fresh throwaway.
  # Bounded by: benign_transactional (must stay low despite 24h-clamped
  # age contributing its full weight).
  subject_age_h: -0.02

  # Resource (agent/key) creation velocity and totals. Bounded on the low
  # side by benign_fast_onboarding (4 resources/1 key in 10 minutes) and
  # benign_integration_heavy (6 resources/1 key in an hour) staying well
  # under the `medium` cut point with no other signal firing; bounded on
  # the high side by dormant_then_blast (9-10 resources/5 keys) needing to
  # reach `high` in combination with name_brand_match alone (no payment
  # signals at all in that fixture) and by burst.jsonl needing `high`
  # within 15s of its last setup event, before any send.
  resource_velocity_1h: 0.35
  resource_total: 0.02
  key_velocity_1h: 0.35
  key_total: 0.02

  # Permanent onboarding facts (never age out, design §4.5). S2 fix round
  # (B5): upgrade_delay_min alone used to double as "did this account
  # upgrade at all" AND "how fast" — a benign account that simply hadn't
  # upgraded YET (a small elapsed-so-far value, indistinguishable from a
  # genuinely fast paid upgrade) inflated risk it shouldn't have.
  # `upgraded` now carries "a paid upgrade happened at all" on its own
  # weight; upgrade_delay_min's magnitude dropped by 20x so a moderate
  # value (whether from a fast upgrade or from a benign account's
  # elapsed-so-far fallback) barely moves the score either way — only the
  # 1440-minute clamp ceiling (a long-unresolved non-upgrade OR
  # benign_transactional's genuinely slow one) still contributes
  # meaningfully, and in the benign direction. Bounded by
  # benign_transactional (upgraded=1 from a real-but-3-days-slow upgrade
  # must still net low) on one side and churn/burst (upgraded=1 within
  # minutes must net high) on the other.
  upgrade_delay_min: -0.0005
  upgraded: 1.3
  declines_before_first_success: 0.6
  first_funding_prepaid: 0.9

  # Name/identity patterns. name_brand_match bounded by dormant_then_blast
  # needing to reach `high` on resource burst + this alone (no payment
  # signals at all there), while benign_integration_heavy's
  # "Stripe Webhook Relay"/"Google Calendar Sync"/"Microsoft Teams Relay"
  # names correctly contribute 0 (S3 fix round: excluded from
  # config/brands.yaml, not a name_brand_match false positive).
  name_brand_match: 2.0
  name_has_at: 0.5

  # first_day_distinct_domains: bounded on the low side by
  # benign_receipts_fanout (round 2, R1) — a day-1 receipts account (1
  # agent) fanning out to 30 REAL distinct customer domains previously
  # scored 0.9634 (tier high) on this feature alone. R1 round 2 fixed it
  # with a hard cap of 10; round 3 (D2) replaced that with a log1p(n)
  # curve (internal/feature.firstDayDistinctDomainsLogScale) instead, so
  # a 300-domain fan-out doesn't read identically to a 30-domain one —
  # scaled so n=10 reproduces the OLD cap's contribution exactly, meaning
  # THIS weight didn't need to change even though the feature's shape did.
  # benign_receipts_fanout now scores ~0.34 (was ~0.15 under the hard cap;
  # test band widened accordingly — log1p's concavity means it gives every
  # count BELOW the anchor point more weight than a flat count did, not
  # just counts above it more than zero). dormant_then_blast (the fixture
  # that needs this weight to matter on the high side) doesn't actually
  # exercise this feature at all — its sends land 7 days after signup,
  # past the first-day window — so neither the cap nor the curve costs
  # that fixture anything.
  first_day_distinct_domains: 0.25

  # Rehearsal-to-self before an external blast (design §4.3's
  # recipient_is_own_identity signal, aggregated into a feature). Bounded
  # on the low side by benign_self_send_only (round 2, R1) — a developer
  # sending 8 test emails to their own inbox, never externally, previously
  # scored 0.9433 (tier high) on this feature alone — and
  # benign_selfsend_brandname (an agent literally named "PayPal
  # integration" that only ever self-sends, previously 0.9880 from BOTH
  # this feature AND a name_brand_match false positive R6 separately
  # fixed). Both now capped at internal/feature.selfSendBeforeExternalCap
  # (2); both fixtures now score ~0.12.
  self_send_before_external: 0.8

  # Linked-subject evidence (design §4.2): a predecessor account sharing a
  # link key that was deleted or already labelled abusive is strong
  # evidence for a churn incarnation. linked_deleted_n bounded by
  # churn.jsonl needing `high` from the third churned subject onward
  # (§1.2(c)) — subject 3 has linked_deleted_n=2 (saturation, S1 fix
  # round, doesn't cap until 3) plus its own onboarding-fact signals.
  linked_deleted_n: 1.3
  linked_labelled_abusive_n: 1.5
  fingerprint_seen_on_other_subjects: 1.0

  # S1 fix round: surfaces design §4.2's fan-in-cap flag; a small weight —
  # truncation happening at all is weak, informational evidence of a hub
  # of accounts, not itself a strong abuse signal, and no committed
  # fixture exercises it (S1's own fan-in cap is 50, far more same-tenant
  # neighbours than any replay fixture here has). Round 2 (R2): no fixture
  # is sensitive enough to this weight alone to prove it's load-bearing —
  # see mutation_test.go's isolatedWeightScenarios for the synthetic
  # scenario that does.
  neighbors_truncated: 0.3

  # Dormant-then-blast pattern. Bounded by dormant_then_blast needing
  # `high` and every fresh-signup fixture (burst, churn, both benign ones)
  # having burst_ratio=1.0 too, purely because nothing OLDER exists yet to
  # compare against — this weight alone can never be the sole
  # discriminator between a legitimate brand-new account and an abusive
  # one, which is why it stayed modest relative to the feature-specific
  # signals above rather than carrying most of the weight itself. Round 2
  # (R1): also bounded by benign_variant_a — the re-review's own "4
  # agents + 2 keys in 10 min then 5 external mails to 5 domains in hour
  # 1" regression guard (measured at 0.49, medium, against these SAME
  # weights) — a WEIGHT increase here (as opposed to R1's feature-level
  # caps, which don't touch this fixture at all) is exactly the kind of
  # change that could have pushed it into `high`; left unchanged and
  # reverified to still land at 0.49.
  burst_ratio_24h_vs_lifetime: 0.3

  # S2b: send volume, addressing common bulk-phishing shapes. Round 2's R1
  # fix round replaced the original hard 7-day calendar-age gate with a
  # history-relative burstFactor (current volume vs. the subject's OWN
  # prior 10-minute peak, floored at 1) times a smooth ageDecayFactor —
  # every weight below was retuned against that new mechanism, not the
  # original one. sends_10m_max carries the main "burst intensity" signal
  # and is sized large enough, on its own, to carry a NO-PRIOR-HISTORY
  # burst (dormant_then_blast, dormant_branded_burst_8d — both fixtures
  # this weight is directly bound by) to `high`; sends_1h and
  # distinct_recipients_1h are smaller companions (correlated with
  # sends_10m_max in a genuine burst, the same velocity/total relationship
  # resource_velocity_1h/resource_total already have — bound by an
  # isolated synthetic scenario, since no committed fixture is sensitive
  # to either alone); sends_first_day is a separate, permanent, NOT
  # history-relative time anchor for a slower first-day ramp the sharper
  # windows don't catch. See PR body's "which fixture bounded which
  # weight" table for the sensitivity sweep.
  #
  # Deliberately NOT one shared value: sends_10m_max is far larger than
  # its companions because it is the ONLY signal available to a fixture
  # like dormant_then_blast (no webmail concentration, no brand) — a large
  # sends_1h/distinct_recipients_1h weight would ALSO fire on
  # benign_receipts_fanout's spread-out (not concentrated) hour-long
  # fan-out, which has a comparable RAW total but a much smaller
  # 10-minute peak; concentrating the big weight on sends_10m_max
  # specifically is what keeps that fixture from crossing into `high` too
  # (it does cross into low `medium` — a documented trade-off, see
  # internal/worker/replay_test.go's own comment on that fixture).
  sends_10m_max: 0.08
  sends_1h: 0.002
  sends_first_day: 0.0008

  # S2b: webmail concentration, also retuned for round 2's R1
  # history-relative mechanism. webmail_recipient_share is a normalized
  # ratio (0..1), so its weight is sized like name_brand_match/upgraded,
  # not like a raw count, and is NOT history-relative or age-decayed (it
  # measures WHO an account emails, not how much — see its own Features
  # field doc comment). webmail_sends_1h is bound by webmail_spread_1h (a
  # fixture whose recipients are spread across a full hour specifically so
  # sends_10m_max stays modest and can't carry the score on its own,
  # isolating webmail_sends_1h's own contribution); distinct_recipients_1h
  # is a smaller companion, correlated with sends_1h/webmail_sends_1h in
  # most fixtures here (bound by an isolated synthetic scenario).
  webmail_recipient_share: 1.1
  webmail_sends_1h: 0.006
  distinct_recipients_1h: 0.002

  # S2b: a brand mentioned in the message SUBJECT rather than (or, per S2,
  # in addition to but never double-counted with) the sending resource's
  # own name — comparable magnitude to name_brand_match since it is the
  # same kind of evidence, read from a different field.
  subject_brand_match: 1.5
